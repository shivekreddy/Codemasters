# ==============================================================================
# GCC FRT Simulation Configuration File — Dutch Grid Code (Netcode Elektriciteit)
# ==============================================================================
# PPM Type D (>= 110 kV)
#
# Units:
#   Voltage   : kV (absolute) or p.u. (normalised) — specified per field
#   Power     : MW / Mvar
#   Time      : seconds [s]
#   Impedance : Ohm
#
# To use for a different grid code, swap this file — do not change the script.
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. PROJECT
# ------------------------------------------------------------------------------
project:
  name:               "Sonvanger Wind Farm"         # Plant / project name
  grid_code:          "NL"                          # Grid code identifier
  grid_code_version:  "Netcode Elektriciteit 2023"
  ppm_type:           "D"                           # PPM Type D (>= 110 kV)
  author:             ""
  date:               "2025-01-01"


# ------------------------------------------------------------------------------
# 2. PLANT - DUTCH
# ------------------------------------------------------------------------------
plant:
  pmax_mw:         65.05    # Rated active power / Pmax [MW] — used for all P setpoints
  poc_voltage_kv:  110.0    # POC busbar nominal voltage [kV]
  q_factor:          0.33   # Qmax = q_factor * Pmax  |  Qmin = -q_factor * Pmax

  # Normal voltage operating range [p.u.] — Dutch Netcode, HV (>44 kV)
  u_min_pu:  0.90
  u_max_pu:  1.10


# ------------------------------------------------------------------------------
# 3. POWERFACTORY ELEMENTS
# Moved to the Python script (ELEMENTS dict and DESC_* constants).
# Update those values when switching projects — no changes needed here.
# ------------------------------------------------------------------------------


# ------------------------------------------------------------------------------
# 4. SIMULATION SETTINGS
# ------------------------------------------------------------------------------
simulation:
  integration_step_s:    0.001   # [s]
  t_start_s:             0.0     # Simulation start time [s]
  t_stop_s:             20.0     # Simulation stop time [s] — same for all 45 cases
  fault_start_s:        10.0     # All faults applied at t=10s; clearance = 10 + fault_duration
  a_stable_integration:   1      # 0=per element, 1=all, 2=per element+composite

  setup_only:   true    # true  = create cases/events, do NOT run simulations
                        # false = create cases AND run simulations
  run_sim_only: false   # true  = skip case creation, only run existing cases


# ------------------------------------------------------------------------------
# 5. VARIABLES TO RECORD
# Signals added to the ElmRes result file for each study case.
# element_ref : key from the elements section above
# variable    : PowerFactory result variable string
# label       : friendly name for plot legends and exports
# ------------------------------------------------------------------------------
record:
  - element_ref: poc_busbar
    variable:    "m:u1"
    label:       "POC Voltage [p.u.]"

  - element_ref: poc_busbar
    variable:    "m:u:A"
    label:       "POC Voltage Phase A [p.u.]"

  - element_ref: poc_busbar
    variable:    "m:u:B"
    label:       "POC Voltage Phase B [p.u.]"

  - element_ref: poc_busbar
    variable:    "m:u:C"
    label:       "POC Voltage Phase C [p.u.]"

  - element_ref: puc_breaker
    variable:    "m:I1P:bus2"
    label:       "PUC Active Current [kA]"

  - element_ref: puc_breaker
    variable:    "m:I1Q:bus2"
    label:       "PUC Reactive Current [kA]"

  - element_ref: puc_breaker
    variable:    "m:P:bus2"
    label:       "PUC Active Power [MW]"

  - element_ref: puc_breaker
    variable:    "m:Q:bus2"
    label:       "PUC Reactive Power [Mvar]"

  - element_ref: lv_busbar
    variable:    "m:u1"
    label:       "LV Busbar Voltage [p.u.]"

  - element_ref: inverter
    variable:    "m:P:bus1"
    label:       "Inverter Active Power [MW]"

  - element_ref: inverter
    variable:    "m:Q:bus1"
    label:       "Inverter Reactive Power [Mvar]"


# ------------------------------------------------------------------------------
# 6. PLOT PAGES
# Blank plot pages created in each study case in PowerFactory.
# ------------------------------------------------------------------------------
plot_pages:
  - "POC"
  - "GU"


# ------------------------------------------------------------------------------
# 7. GRID CODE REQUIREMENTS
# Dutch Netcode Elektriciteit — PPM Type D (>= 110 kV)
#
# Fault duration per scenario:
#   Scenario 1: Uret < 0.05  ->  420 ms
#   Scenario 2: Uret = 0.20  ->  900 ms
#   Scenario 3: Uret = 0.40  -> 1550 ms
#   Scenario 4: Uret = 0.60  -> 2200 ms
#   Scenario 5: Uret = 0.85  -> 3000 ms
# ------------------------------------------------------------------------------
requirements:   #remove dashes and brackets - makes stuff nicer
  lvrt_curve:
    - [0.000, 0.00]
    - [0.420, 0.00]
    - [0.420, 0.05]
    - [0.900, 0.20]
    - [1.550, 0.40]
    - [2.200, 0.60]
    - [3.000, 0.85]
    - [3.000, 1.00]

  active_power_recovery:
    min_fraction: 0.90    # must restore to >= 90% of pre-fault active power
    within_s:     1.00    # within 1s after fault clearance


# ------------------------------------------------------------------------------
# 8. OPERATING CONDITIONS
# One entry per study case (45 total — one op scenario per case in PowerFactory).
#
# psetp  : PFC controller active power setpoint — always "Pmax" (100% rated power)
# qsetp  : station controller reactive power setpoint
#            Q0   ->  0.0        (no reactive power)
#            Qmax -> "Qmax"      resolved at runtime to +q_factor * Pmax
#            Qmin -> "Qmin"      resolved at runtime to -q_factor * Pmax
# usetp  : external grid voltage setpoint [p.u.] — 1.00 for all cases
#
# Symbols resolved at runtime from the plant section:
#   "Pmax" -> pmax_mw
#   "Qmax" -> +q_factor * Pmax
#   "Qmin" -> -q_factor * Pmax
# ------------------------------------------------------------------------------
operating_conditions:

  # ---------- 1PH Q0 ----------------------------------------------------------
  - {name: "FRT 1PH 0.05 Q0",   psetp: "Pmax", qsetp: 0.0,    usetp: 1.00}
  - {name: "FRT 1PH 0.2 Q0",    psetp: "Pmax", qsetp: 0.0,    usetp: 1.00}
  - {name: "FRT 1PH 0.4 Q0",    psetp: "Pmax", qsetp: 0.0,    usetp: 1.00}
  - {name: "FRT 1PH 0.6 Q0",    psetp: "Pmax", qsetp: 0.0,    usetp: 1.00}
  - {name: "FRT 1PH 0.85 Q0",   psetp: "Pmax", qsetp: 0.0,    usetp: 1.00}

  # ---------- 1PH Qmax --------------------------------------------------------
  - {name: "FRT 1PH 0.05 Qmax", psetp: "Pmax", qsetp: "Qmax", usetp: 1.00}
  - {name: "FRT 1PH 0.2 Qmax",  psetp: "Pmax", qsetp: "Qmax", usetp: 1.00}
  - {name: "FRT 1PH 0.4 Qmax",  psetp: "Pmax", qsetp: "Qmax", usetp: 1.00}
  - {name: "FRT 1PH 0.6 Qmax",  psetp: "Pmax", qsetp: "Qmax", usetp: 1.00}
