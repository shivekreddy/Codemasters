  - {name: "FRT 1PH 0.85 Qmin", psetp: "Pmax", qsetp: "Qmin", usetp: 1.00}

  # ---------- 2PH Q0 ----------------------------------------------------------
  - {name: "FRT 2PH 0.05 Q0",   psetp: "Pmax", qsetp: 0.0,    usetp: 1.00}
  - {name: "FRT 2PH 0.2 Q0",    psetp: "Pmax", qsetp: 0.0,    usetp: 1.00}
  - {name: "FRT 2PH 0.4 Q0",    psetp: "Pmax", qsetp: 0.0,    usetp: 1.00}
