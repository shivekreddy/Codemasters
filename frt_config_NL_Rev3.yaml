  - {name: "FRT 1PH 0.2 Qmin",  psetp: "Pmax", qsetp: "Qmin", usetp: 1.00}
  - {name: "FRT 1PH 0.4 Qmin",  psetp: "Pmax", qsetp: "Qmin", usetp: 1.00}
