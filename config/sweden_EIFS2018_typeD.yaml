config_type: grid_code_requirements

meta:
  country: Sweden
  tso: Svenska kraftnät
  grid_code:
    name: EIFS 2018:2
    version: "2018"
    legal_basis: NC RfG (EU 2016/631) + national regulation
  voltage_level: transmission
  module_type: D
  certification_type: full_compliance
  reference_point: NAP

assumptions:
  nominal_frequency_hz: 50
  voltage_reference_pu: 1.0
  sign_convention:
    P_positive: generation
    Q_positive: inductive

# ============================================================================
# COMMON REQUIREMENTS (technology‑neutral)
# ============================================================================

requirements_common:

  # Frequency withstand capability and ROCOF limits (EIFS 2018:2 Chapter 3 §§1–2)
  frequency_operation:
    applicable: true
    evaluation_method: rms
    steady_state:
      limits_hz:
        min: 47.5
        max: 51.5
      minimum_operation_times:
        47.5_48.5: 30_min
        48.5_49.0: 30_min
        49.0_51.0: unlimited
        51.0_51.5: 30_min
    rocof:
      max_hz_per_s: 2.0
    verification: null

  # Continuous voltage operating range (EIFS 2018:2 §18)
  voltage_operation:
    applicable: true
    evaluation_method: rms
    steady_state_band_pu:
      min: 0.90
      max: 1.05
    overvoltage_endurance:
      levels: null
    undervoltage_endurance:
      levels: null

  # Active power controllability for Type D (EIFS 2018:2 §§19, 31–32)
  active_power_control:
    applicable: true
    evaluation_method: rms
    setpoint_changes:
      start_time_s: 10
      full_range_time_s: 60
      tolerance_percent: 2
    ramp_rates:
      percent_per_min: 100

  # Voltage‑dependent active power reduction P(U) (EIFS 2018:2, SvK Bilaga 5)
  active_power_voltage_dependency:
    applicable: null
    evaluation_method: rms
    project_defined: true
    p_reduction_required: true
    voltage_dependency:
      voltage_pu_to_p_limits:
        defined_externally: true
    recovery_after_voltage_normalization:
      required: true

  # Steady‑state reactive power as function of voltage Q(U) (EIFS 2018:2, SvK Bilaga 5)
  reactive_power_voltage_dependency:
    applicable: null
    evaluation_method: rms
    project_defined: true
    characteristic:
      defined_externally: true
    override_by_tso: true

  # Static reactive power capability at NAP (EIFS 2018:2, project‑specific)
  reactive_power_capability:
    applicable: null
    evaluation_method: rms
    evaluation_point: NAP
    normalization: Q_over_P_inst
    project_defined: true
    variants: null

  # Voltage deviation limits due to reactive power changes (EIFS 2018:2, SvK Bilaga 5)
  voltage_deviation_due_to_reactive_power:
    applicable: null
    evaluation_method: rms
    project_defined: true
    max_voltage_deviation_pu:
      absolute: null
      per_reactive_power_step: null
      defined_externally: true

  # Power quality limits for harmonics and flicker (EIFS 2018:2 §17)
  power_quality:
    applicable: true
    evaluation_method: rms
    harmonics:
      standard: IEC_61000_4_7
      limits_reference: null
    flicker:
      pst_max: null
      plt_max: null

  # Mandatory simulation model for Type D (SvK Bilaga 5, Chapters 2–5)
  simulation_model:
    applicable: true
    evaluation_method: rms
    required: true
    model_type:
      - rms
    validation_required: true
    accuracy_requirements:
      active_power_percent: 5
      reactive_power_percent: 5
      voltage_percent: null
    simulation_requirements:
      dynamic_grid_equivalent: provided_by_svk
      frequency_steps: mandatory
      frequency_ramps: mandatory
      fault_simulations: extended

# ============================================================================
# TYPE 1 REQUIREMENTS (synchronous machines)
# ============================================================================

requirements_type_1:

  # Fault ride‑through of synchronous machines (EIFS 2018:2 §§11–16)
  fault_ride_through:
    applicable: true
    evaluation_method: rms
    fault_types:
      - three_phase
    voltage_time_curve_pu:
      0.0: 1.0
      0.20: 0.25
      0.90: 0.90
    stay_connected_above_curve: true
    post_fault_recovery:
      voltage_pu: 0.90
      active_power:
        recovery_time_s: null
        tolerance_percent: null
    verification: null

  # Active power recovery after fault (EIFS 2018:2, SvK Bilaga 5)
  active_power_recovery_after_fault:
    applicable: null
    evaluation_method: rms
    project_defined: true
    recovery_to_prefault_percent: null
    recovery_time_s:
      max: null
    recovery_gradient:
      percent_per_s: null

  # Voltage recovery after fault (EIFS 2018:2, SvK Bilaga 5)
  voltage_recovery_after_fault:
    applicable: null
    evaluation_method: rms
    project_defined: true
    recovery_levels: null

  # Short‑circuit current contribution of synchronous units (EIFS 2018:2 §14)
  short_circuit_contribution:
    applicable: true
    evaluation_method: calculation
    required: true
    behaviour: synchronous
    calculation_standard: IEC_60909
    time_points_ms:
      - 0
      - 200

# ============================================================================
# TYPE 2 REQUIREMENTS (converter‑based plants)
# ============================================================================

requirements_type_2:

  # LFSM‑O, LFSM‑U and FSM frequency response (EIFS 2018:2 §§3–29)
  active_power_frequency_response:
    applicable: true
    evaluation_method: rms
    lfsm_o:
      applicable: true
      activation_threshold_hz: 50.5
      droop_percent: 8
      deadband_hz: 0.5
      response:
        start_time_s: 2
        full_activation_s: 30
    lfsm_u:
      applicable: true
      activation_threshold_hz: 49.5
      droop_percent: 8
      deadband_hz: 0.5
      response:
        start_time_s: 2
        full_activation_s: 30
    fsm:
      applicable: true
      droop_percent_range:
        min: 2
        max: 12
      deadband_hz_range:
        min: 0.1
        max: 0.2
      full_response_duration_min: 15
    verification: null

  # Sustained frequency response duration (EIFS 2018:2, SvK Bilaga 5)
  sustained_frequency_support:
    applicable: true
    evaluation_method: rms
    project_defined: true
    minimum_duration_s: null
    discontinuation_conditions:
      frequency_restored: true
      tso_release_required: false

  # LVRT/FRT for converter‑based plants (EIFS 2018:2 §12)
  fault_ride_through:
    applicable: true
    evaluation_method: rms
    fault_types:
      - three_phase
      - two_phase
      - single_phase_to_ground
    voltage_time_curve_pu:
      0.0: 1.0
      0.20: 0.15
      0.40: 0.15
      0.60: 0.15
      2.60: 0.85
      10.0: 0.90
    stay_connected_above_curve: true
    post_fault_recovery:
      voltage_pu: 0.90
      active_power:
        recovery_time_s: 2.0
        tolerance_percent: 5
    verification: null

  # Voltage recovery after converter fault ride‑through (EIFS 2018:2, SvK Bilaga 5)
  voltage_recovery_after_fault:
    applicable: null
    evaluation_method: rms
    project_defined: true
    recovery_levels: null

  # Mandatory dynamic voltage support via reactive current injection
  # (EIFS 2018:2 §12, SvK Bilaga 5)
  dynamic_voltage_support:
    applicable: true
    evaluation_method: rms
    reactive_current:
      enabled: true
      proportional_to_voltage_deviation: true
      k_factor_range:
        min: null
        max: null
      response_time_ms:
        start: null
        full: null
    priority: reactive_over_active

  # Short‑circuit current behaviour of converter‑based plants (EIFS 2018:2 §12)
  short_circuit_contribution:
    applicable: true
    evaluation_method: calculation
    required: true
    behaviour: converter_limited
    calculation_standard: null
    time_points_ms: null